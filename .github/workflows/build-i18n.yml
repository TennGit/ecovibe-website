# Regenerates /nl/, /zh/, the privacy pages and sitemap.xml whenever the
# sources change on main, and commits the result so GitHub Pages serves it.
name: Build language pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - scripts/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-i18n
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        run: node scripts/build-i18n.js

      - name: Commit generated pages
        run: |
          # sitemap lastmod alone changing is not worth a commit
          if git diff --quiet -- nl zh privacy && git diff --quiet -I '<lastmod>' -- sitemap.xml; then
            echo "Generated pages already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nl zh privacy sitemap.xml
          git commit -m "Regenerate language pages"
          git push
